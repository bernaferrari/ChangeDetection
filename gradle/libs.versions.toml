# Coil for image loading
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-core = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }

# Fragment support
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }

# Material Icons Extended
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# Additional migrated dependencies
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
threeten-android = { module = "com.jakewharton.threetenabp:threetenabp", version.ref = "threeTenAndroid" }
timeago = { module = "com.github.marlonlom:timeago", version.ref = "timeAgo" }
commons-text = { module = "org.apache.commons:commons-text", version.ref = "commonsText" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
subsampling-scale-imageview = { module = "com.davemorrissey.labs:subsampling-scale-image-view", version.ref = "subsamplingScaleImageView" }
material-about-library = { module = "com.github.daniel-stoneuk:material-about-library", version.ref = "materialAboutLibrary" }
stetho = { module = "com.facebook.stetho:stetho", version.ref = "stetho" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
android-test = { id = "com.android.test", version.ref = "androidGradlePlugin" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
gradle-versions = { id = "com.github.ben-manes.versions", version.ref = "gradle-versions" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
