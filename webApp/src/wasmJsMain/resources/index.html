<!DOCTYPE html>
<html lang="en" style="background:#12131a;color-scheme:dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#12131a">
    <base href="/">
    <meta name="description" content="A synthetic, interactive Compose Multiplatform demo of Change Detection.">
    <title>Change Detection — Interactive demo</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body, canvas { width: 100%; height: 100%; margin: 0; }
        body { overflow: hidden; background: #12131a; }
        #loading {
            align-items: center;
            background: #12131a;
            color: #e4e1ec;
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            gap: 1rem;
            height: 100%;
            justify-content: center;
        }
        .spinner {
            animation: spin 0.8s linear infinite;
            border: 3px solid rgba(228, 225, 236, 0.16);
            border-radius: 50%;
            border-top-color: #b8c4ff;
            height: 36px;
            width: 36px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
</head>
<body>
<div id="loading" role="status" aria-live="polite" aria-busy="true">
    <div class="spinner" aria-hidden="true"></div>
    <span>Loading Change Detection demo…</span>
</div>
<script src="changedetection-demo.js"></script>
</body>
</html>
