<!DOCTYPE html>
<html lang="en" style="background:#12131a;color-scheme:dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#12131a">
    <base href="/">
    <meta name="description" content="Explore a private, local-first page monitoring experience built with Compose Multiplatform.">
    <link rel="icon" type="image/png" href="icon.png">
    <title>Change Detection — Interactive demo</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body, canvas { width: 100%; height: 100%; margin: 0; }
        body { overflow: hidden; background: #12131a; -webkit-font-smoothing: antialiased; }
        #loading {
            align-items: center;
            background: #12131a;
            color: #e4e1ec;
            display: flex;
            flex-direction: column;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            gap: 1rem;
            height: 100%;
            justify-content: center;
        }
        .loading-mark {
            height: 64px;
            width: 64px;
        }
        .loading-mark .signal { animation: signal 1.1s ease-in-out infinite alternate; }
        @keyframes signal { from { opacity: .36; } to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .loading-mark .signal { animation: none; } }
    </style>
</head>
<body>
<div id="loading" role="status" aria-live="polite" aria-busy="true">
    <svg class="loading-mark" aria-hidden="true" viewBox="0 0 64 64">
        <path d="M0 20Q0 0 20 0H44Q64 0 64 20V56Q64 64 56 64H20Q0 64 0 44Z" fill="#303984"/>
        <rect x="12" y="11" width="31" height="34" rx="8" fill="none" stroke="#7ce4c5" stroke-width="4"/>
        <rect x="23" y="22" width="31" height="31" rx="8" fill="none" stroke="#f0efff" stroke-width="4"/>
        <circle class="signal" cx="49" cy="18" r="5" fill="#ff7b9d"/>
    </svg>
    <span>Loading Change Detection demo…</span>
</div>
<script src="changedetection-demo.js"></script>
</body>
</html>
