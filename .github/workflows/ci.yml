name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: changedetection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Compose Desktop verification
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK for project configuration
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Desktop journeys and shared platform compilation
        run: >-
          ./gradlew
          :shared:desktopTest
          :shared:compileKotlinIosSimulatorArm64
          :shared:spotlessCheck

      - name: Save Desktop verification reports and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verification-reports
          path: |
            shared/build/reports/tests/desktopTest/
            shared/build/test-results/desktopTest/
            build/desktop-review/**/*.png
          retention-days: 14
          if-no-files-found: warn

  android:
    name: Android verification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify Android
        run: >-
          ./gradlew
          :shared:spotlessCheck
          :shared:testAndroidHostTest
          :shared:assembleAndroidDeviceTest
          :androidApp:lintDebug
          :androidApp:assembleDebug
          :androidApp:assembleRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android device tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 8G
          disable-animations: false
          script: ./gradlew :shared:connectedAndroidDeviceTest

      - name: Save Android verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            shared/build/reports/
            shared/build/test-results/
            shared/build/outputs/androidTest-results/
            androidApp/build/reports/
          retention-days: 14
          if-no-files-found: warn

  web-demo:
    name: Web demo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify the web demo
        run: |
          ./gradlew :webDemo:wasmJsBrowserDistribution --no-daemon --build-cache --configuration-cache
          dist=webDemo/build/dist/wasmJs/productionExecutable
          test -s "$dist/index.html"
          test -s "$dist/changedetection-demo.js"
          grep -q 'changedetection-demo.js' "$dist/index.html"
          test -n "$(find "$dist" -maxdepth 1 -name '*.wasm' -print -quit)"

  web-site:
    name: Marketing site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
