name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: changedetection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-demo:
    name: KMP web demo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and verify the KMP web demo
        run: ./scripts/verify-kmp-web-demo.sh --ci
